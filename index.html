<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Analyzer</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 6px;
            outline: none;
            margin-bottom: 15px;
        }

        .strength-container {
            width: 100%;
            height: 12px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .strength-bar {
            height: 12px;
            width: 0%;
            transition: 0.4s;
        }

        #message {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        ul {
            margin-top: 20px;
            padding-left: 20px;
        }

        li {
            margin-bottom: 8px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>Password Strength Analyzer</h2>

        <input type="password" id="password" placeholder="Enter your password">

        <div class="strength-container">
            <div class="strength-bar" id="strengthBar"></div>
        </div>

        <div id="message">Strength: </div>

        <ul>
            <li>Minimum 8 characters</li>
            <li>At least 1 uppercase letter</li>
            <li>At least 1 lowercase letter</li>
            <li>At least 1 number</li>
            <li>At least 1 special character</li>
        </ul>

    </div>

    <script>

        const password = document.getElementById("password");
        const strengthBar = document.getElementById("strengthBar");
        const message = document.getElementById("message");

        password.addEventListener("input", function () {

            let pass = password.value;
            let score = 0;

            // Regex Conditions
            if (pass.length >= 8) score++;

            if (/[A-Z]/.test(pass)) score++;

            if (/[a-z]/.test(pass)) score++;

            if (/[0-9]/.test(pass)) score++;

            if (/[^A-Za-z0-9]/.test(pass)) score++;

            // Strength Checking
            if (score === 1) {
                strengthBar.style.width = "20%";
                strengthBar.style.background = "red";
                message.innerHTML = "Strength: Weak";
            }

            else if (score === 2 || score === 3) {
                strengthBar.style.width = "60%";
                strengthBar.style.background = "orange";
                message.innerHTML = "Strength: Medium";
            }

            else if (score === 4) {
                strengthBar.style.width = "80%";
                strengthBar.style.background = "blue";
                message.innerHTML = "Strength: Strong";
            }

            else if (score === 5) {
                strengthBar.style.width = "100%";
                strengthBar.style.background = "green";
                message.innerHTML = "Strength: Very Strong";
            }

            else {
                strengthBar.style.width = "0%";
                message.innerHTML = "Strength:";
            }

        });

    </script>

</body>
</html>
